<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style type="text/css">
      /*<![CDATA[*/
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      .bg { fill: #0b0f19; }
      .phone-body { fill: #111827; stroke: #374151; stroke-width: 2; }
      .phone-screen { fill: #f8fafc; }
      .notch-bg { fill: #111827; }

      .title-font { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .desc-font { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94a3b8; }
      .small-font { font-family: 'Inter', sans-serif; font-size: 10px; fill: #475569; font-weight: 600; }
      .label-font { font-family: 'Inter', sans-serif; font-size: 10px; fill: #1e293b; font-weight: 600; }
      .feature-head { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #e2e8f0; }
      .feature-body { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748b; }
      .badge-font { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; }
      .code-font { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; }

      .header-bar { fill: #6366f1; }
      .header-text { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .card-rect { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .skel-line { fill: #e2e8f0; }
      .backdrop-rect { fill: #0f172a; }

      /* ══════ ANIMATION TIMING ══════
         0-3s   : Closed (app visible)
         3-3.6s : Open (backdrop + actions fan out)
         3.6-7s : Hold open
         7-7.6s : Close
         7.6-10s: Hold closed, loop
      ══════════════════════════════ */

      /* Backdrop fade */
      @keyframes bdFade {
        0%, 30%  { opacity: 0; }
        36%, 70% { opacity: 0.5; }
        76%, 100%{ opacity: 0; }
      }
      .bd-anim { animation: bdFade 10s ease infinite; }

      /* FAB icon rotate (+ → ×) */
      @keyframes iconSpin {
        0%, 30%  { transform: rotate(0deg); }
        36%, 70% { transform: rotate(45deg); }
        76%, 100%{ transform: rotate(0deg); }
      }

      /* Action buttons: scale from 0 at own center */
      @keyframes pop1 {
        0%, 30%  { transform: scale(0); opacity: 0; }
        36%      { transform: scale(1.15); opacity: 1; }
        39%, 66% { transform: scale(1); opacity: 1; }
        72%      { transform: scale(0); opacity: 0; }
        100%     { transform: scale(0); opacity: 0; }
      }
      @keyframes pop2 {
        0%, 32%  { transform: scale(0); opacity: 0; }
        38%      { transform: scale(1.15); opacity: 1; }
        41%, 64% { transform: scale(1); opacity: 1; }
        70%      { transform: scale(0); opacity: 0; }
        100%     { transform: scale(0); opacity: 0; }
      }
      @keyframes pop3 {
        0%, 34%  { transform: scale(0); opacity: 0; }
        40%      { transform: scale(1.15); opacity: 1; }
        43%, 62% { transform: scale(1); opacity: 1; }
        68%      { transform: scale(0); opacity: 0; }
        100%     { transform: scale(0); opacity: 0; }
      }

      /* Labels fade */
      @keyframes lbl1 { 0%, 37% { opacity: 0; } 41%, 64% { opacity: 1; } 68%, 100% { opacity: 0; } }
      @keyframes lbl2 { 0%, 39% { opacity: 0; } 43%, 62% { opacity: 1; } 66%, 100% { opacity: 0; } }
      @keyframes lbl3 { 0%, 41% { opacity: 0; } 45%, 60% { opacity: 1; } 64%, 100% { opacity: 0; } }

      /* Tap ring on FAB */
      @keyframes ring {
        0%, 29% { r: 28; opacity: 0; stroke-width: 2; }
        31%     { r: 28; opacity: 0.5; }
        36%     { r: 40; opacity: 0; }
        69%     { r: 28; opacity: 0; }
        71%     { r: 28; opacity: 0.5; }
        76%     { r: 40; opacity: 0; }
        100%    { r: 28; opacity: 0; }
      }

      /* Feature pulse */
      @keyframes fpulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .fp { animation: fpulse 3s ease-in-out infinite; }
      /*]]>*/
    </style>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12" />
    </filter>
    <filter id="fabglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="500" rx="16" ry="16" />

  <!-- Title -->
  <g transform="translate(30, 40)">
    <text class="title-font">🚀 react-native-speed-dial</text>
    <text class="desc-font" y="24">Radial &amp; linear FAB with spring-animated GPU-accelerated layouts</text>
  </g>

  <!-- ════════════ PHONE MOCKUP ════════════ -->
  <g transform="translate(55, 80)">
    <!-- Phone body -->
    <rect class="phone-body" width="250" height="400" rx="28" ry="28" />
    <!-- Screen -->
    <rect class="phone-screen" x="10" y="10" width="230" height="380" rx="20" ry="20" />
    <!-- Notch -->
    <rect class="notch-bg" x="80" y="10" width="90" height="24" rx="0" ry="0" />
    <rect class="notch-bg" x="80" y="10" width="90" height="18" rx="0" ry="10" />
    <!-- Status bar -->
    <text class="small-font" x="24" y="28">9:41</text>
    <text class="small-font" x="202" y="28">100%</text>

    <!-- App header -->
    <rect class="header-bar" x="10" y="34" width="230" height="42" />
    <text class="header-text" x="24" y="60">My App</text>

    <!-- Content cards -->
    <g transform="translate(22, 88)">
      <rect class="card-rect" width="206" height="50" rx="8" ry="8" filter="url(#shadow1)" />
      <rect class="skel-line" x="12" y="12" width="90" height="8" rx="4" ry="4" />
      <rect class="skel-line" x="12" y="26" width="140" height="6" rx="3" ry="3" />
      <rect class="skel-line" x="12" y="36" width="100" height="6" rx="3" ry="3" />
    </g>
    <g transform="translate(22, 148)">
      <rect class="card-rect" width="206" height="50" rx="8" ry="8" filter="url(#shadow1)" />
      <rect class="skel-line" x="12" y="12" width="110" height="8" rx="4" ry="4" />
      <rect class="skel-line" x="12" y="26" width="160" height="6" rx="3" ry="3" />
      <rect class="skel-line" x="12" y="36" width="80" height="6" rx="3" ry="3" />
    </g>
    <g transform="translate(22, 208)">
      <rect class="card-rect" width="206" height="50" rx="8" ry="8" filter="url(#shadow1)" />
      <rect class="skel-line" x="12" y="12" width="70" height="8" rx="4" ry="4" />
      <rect class="skel-line" x="12" y="26" width="150" height="6" rx="3" ry="3" />
      <rect class="skel-line" x="12" y="36" width="120" height="6" rx="3" ry="3" />
    </g>
    <g transform="translate(22, 268)">
      <rect class="card-rect" width="206" height="50" rx="8" ry="8" filter="url(#shadow1)" />
      <rect class="skel-line" x="12" y="12" width="100" height="8" rx="4" ry="4" />
      <rect class="skel-line" x="12" y="26" width="130" height="6" rx="3" ry="3" />
      <rect class="skel-line" x="12" y="36" width="90" height="6" rx="3" ry="3" />
    </g>

    <!-- ══ BACKDROP ══ -->
    <rect class="backdrop-rect bd-anim" x="10" y="34" width="230" height="356" rx="0" ry="20" />

    <!-- ══ ACTION 1: Camera — straight up from FAB ══ -->
    <!-- FAB is at (200, 355). Action 1 target: (200, 250) -->
    <g style="animation: pop1 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: 200px 250px;">
      <circle cx="200" cy="250" r="20" fill="#E11D48" />
      <text x="192" y="255" font-family="Inter, sans-serif" font-size="14px" fill="#fff">📷</text>
    </g>
    <g style="animation: lbl1 10s ease infinite;">
      <rect x="132" y="241" width="56" height="20" rx="5" ry="5" fill="#fff" filter="url(#shadow1)" />
      <text class="label-font" x="138" y="255">Camera</text>
    </g>

    <!-- ══ ACTION 2: Gallery — diagonal upper-left from FAB ══ -->
    <!-- Target: (200-74, 355-74) = (126, 281) -->
    <g style="animation: pop2 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: 126px 281px;">
      <circle cx="126" cy="281" r="20" fill="#2563EB" />
      <text x="118" y="286" font-family="Inter, sans-serif" font-size="14px" fill="#fff">🖼️</text>
    </g>
    <g style="animation: lbl2 10s ease infinite;">
      <rect x="58" y="272" width="56" height="20" rx="5" ry="5" fill="#fff" filter="url(#shadow1)" />
      <text class="label-font" x="64" y="286">Gallery</text>
    </g>

    <!-- ══ ACTION 3: Document — straight left from FAB ══ -->
    <!-- Target: (200-105, 355) = (95, 355) -->
    <g style="animation: pop3 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: 95px 355px;">
      <circle cx="95" cy="355" r="20" fill="#059669" />
      <text x="87" y="360" font-family="Inter, sans-serif" font-size="14px" fill="#fff">📄</text>
    </g>
    <g style="animation: lbl3 10s ease infinite;">
      <rect x="34" y="346" width="50" height="20" rx="5" ry="5" fill="#fff" filter="url(#shadow1)" />
      <text class="label-font" x="42" y="360">Doc</text>
    </g>

    <!-- ══ MAIN FAB ══ -->
    <!-- Tap ring -->
    <circle cx="200" cy="355" r="28" fill="none" stroke="#6366f1" stroke-width="2" style="animation: ring 10s ease infinite;" />
    <!-- FAB circle -->
    <circle cx="200" cy="355" r="28" fill="#6366f1" filter="url(#fabglow)" />
    <!-- Plus/Cross icon -->
    <g style="animation: iconSpin 10s ease-in-out infinite; transform-origin: 200px 355px;">
      <line x1="190" y1="355" x2="210" y2="355" stroke="#fff" stroke-width="3" stroke-linecap="round" />
      <line x1="200" y1="345" x2="200" y2="365" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- ════════════ RIGHT PANEL: FEATURES ════════════ -->
  <g transform="translate(355, 90)">
    <!-- Badges -->
    <rect x="0" y="0" width="90" height="24" rx="6" ry="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text class="badge-font" x="8" y="16" fill="#a5b4fc">📐 RADIAL</text>
    <rect x="100" y="0" width="84" height="24" rx="6" ry="6" fill="#1e3a2f" stroke="#059669" stroke-width="1" />
    <text class="badge-font" x="108" y="16" fill="#6ee7b7">📏 LINEAR</text>

    <!-- Feature 1 -->
    <g transform="translate(0, 50)" class="fp">
      <circle cx="14" cy="10" r="14" fill="#1e1b4b" />
      <text x="7" y="15" font-family="Inter, sans-serif" font-size="14px">⚡</text>
      <text class="feature-head" x="36" y="8">GPU-Accelerated</text>
      <text class="feature-body" x="36" y="24">Native driver spring physics, 60 FPS</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0, 105)" class="fp" style="animation-delay: 0.5s;">
      <circle cx="14" cy="10" r="14" fill="#1c1917" />
      <text x="7" y="15" font-family="Inter, sans-serif" font-size="14px">🎨</text>
      <text class="feature-head" x="36" y="8">Fully Customizable</text>
      <text class="feature-body" x="36" y="24">Colors, icons, labels, sizes, angles</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 160)" class="fp" style="animation-delay: 1s;">
      <circle cx="14" cy="10" r="14" fill="#0c1a25" />
      <text x="7" y="15" font-family="Inter, sans-serif" font-size="14px">📦</text>
      <text class="feature-head" x="36" y="8">Zero Native Code</text>
      <text class="feature-body" x="36" y="24">Works in Expo Go, no native linking</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(0, 215)" class="fp" style="animation-delay: 1.5s;">
      <circle cx="14" cy="10" r="14" fill="#1a0f0f" />
      <text x="7" y="15" font-family="Inter, sans-serif" font-size="14px">👆</text>
      <text class="feature-head" x="36" y="8">Backdrop Dismiss</text>
      <text class="feature-body" x="36" y="24">Tap outside to close, auto-dimming</text>
    </g>

    <!-- Code snippet -->
    <g transform="translate(0, 280)">
      <rect fill="#0f172a" width="410" height="100" rx="10" ry="10" stroke="#1e293b" stroke-width="1" />
      <text class="code-font" x="14" y="22" fill="#64748b">// Quick start</text>
      <text class="code-font" x="14" y="40" fill="#c084fc">import</text>
      <text class="code-font" x="58" y="40" fill="#e2e8f0"> { SpeedDial } </text>
      <text class="code-font" x="168" y="40" fill="#c084fc">from</text>
      <text class="code-font" x="200" y="40" fill="#fbbf24">'react-native-speed-dial'</text>
      <text class="code-font" x="14" y="62" fill="#e2e8f0">&lt;</text>
      <text class="code-font" x="22" y="62" fill="#22d3ee">SpeedDial</text>
      <text class="code-font" x="14" y="80" fill="#fbbf24">  layout</text>
      <text class="code-font" x="76" y="80" fill="#e2e8f0">=</text>
      <text class="code-font" x="84" y="80" fill="#4ade80">"radial"</text>
      <text class="code-font" x="140" y="80" fill="#fbbf24"> actions</text>
      <text class="code-font" x="202" y="80" fill="#e2e8f0">={actions} /&gt;</text>
    </g>
  </g>
</svg>
